<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manga Galactic — Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand">
      <div class="logo-orb">
        <img src="https://iili.io/Ct9791V.jpg" alt="Manga Galactic">
      </div>
      <div>
        <h1>Manga Galactic</h1>
        <p class="subtitle" id="userGreeting">Welcome, Reader 🚀</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-inline-share" onclick="openTelegramInline()" title="Search Manga in Telegram Inline Mode">
        <i class="fa-solid fa-bolt"></i> Inline Search
      </button>
      <a href="/webhub" class="btn-profile-icon" title="View Web Hub & Shelves">
        <i class="fa-solid fa-user-astronaut"></i>
      </a>
    </div>
  </header>

  <!-- Live Search Bar -->
  <section class="search-section">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search manga, manhwa, novels..." autocomplete="off">
      <button id="clearSearchBtn" class="clear-btn" style="display:none;"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </section>

  <!-- Category Filter Pills -->
  <nav class="filter-nav">
    <div class="filter-scroll">
      <button class="filter-pill active" data-filter="all"><i class="fa-solid fa-globe"></i> All</button>
      <button class="filter-pill" data-filter="toprated"><i class="fa-solid fa-star"></i> Top Rated</button>
      <button class="filter-pill" data-filter="subscribed"><i class="fa-solid fa-bell"></i> Subscribed</button>
      <button class="filter-pill" data-filter="bookmarked"><i class="fa-solid fa-bookmark"></i> Bookmarks</button>
      <button class="filter-pill" data-filter="read"><i class="fa-solid fa-check"></i> Read</button>
      <button class="filter-pill" data-filter="favorite"><i class="fa-solid fa-heart"></i> Favorites</button>
      <button class="filter-pill" data-filter="completed"><i class="fa-solid fa-flag-checkered"></i> Completed</button>
      <button class="filter-pill" data-filter="hold"><i class="fa-solid fa-pause"></i> On Hold</button>
      <button class="filter-pill" data-filter="dropped"><i class="fa-solid fa-hand"></i> Dropped</button>
    </div>
  </nav>

  <!-- Status Bar Summary -->
  <div class="catalog-status-bar">
    <span id="catalogCount">Loading titles...</span>
    <span id="syncIndicator" class="sync-badge"><i class="fa-solid fa-bolt"></i> Live Sync</span>
  </div>

  <!-- Manga Grid Container -->
  <main class="catalog-grid" id="mangaGrid">
    <!-- Skeleton loader cards -->
    <div class="manga-card skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
    <div class="manga-card skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
    <div class="manga-card skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
    <div class="manga-card skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div></div>
  </main>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="empty-icon"><i class="fa-solid fa-book-open"></i></div>
    <h3>No Manga Found</h3>
    <p>Try searching for a different title or select another filter.</p>
  </div>

  <!-- Bookmark Modal -->
  <div id="bookmarkModal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="bmModalTitle">Bookmark Manga</h3>
        <button class="modal-close" onclick="closeBookmarkModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="bmModalSub" class="modal-subtitle">Save your current chapter progress</p>
        <div class="input-group">
          <label for="bmChapterInput">Current Chapter</label>
          <input type="number" id="bmChapterInput" min="1" placeholder="e.g. 150">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeBookmarkModal()">Cancel</button>
        <button class="btn btn-primary" id="bmSaveBtn">Save Bookmark</button>
      </div>
    </div>
  </div>

  <!-- 5-Star Rating & Review Modal -->
  <div id="rateModal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="rateModalTitle">Rate & Review</h3>
        <button class="modal-close" onclick="closeRateModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-subtitle">Share your score and thoughts with the community</p>
        
        <div class="star-rating-selector">
          <span class="star-pick" data-val="1"><i class="fa-solid fa-star"></i></span>
          <span class="star-pick" data-val="2"><i class="fa-solid fa-star"></i></span>
          <span class="star-pick" data-val="3"><i class="fa-solid fa-star"></i></span>
          <span class="star-pick" data-val="4"><i class="fa-solid fa-star"></i></span>
          <span class="star-pick" data-val="5"><i class="fa-solid fa-star"></i></span>
        </div>
        <div class="rating-label-hint" id="ratingScoreHint">5 / 5 Stars</div>

        <div class="input-group" style="margin-top: 14px;">
          <label for="reviewTextInput">Review (Optional)</label>
          <textarea id="reviewTextInput" rows="3" placeholder="What do you think of this manga?"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeRateModal()">Cancel</button>
        <button class="btn btn-primary" id="rateSubmitBtn">Submit Rating</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="/static/js/app.js"></script>
</body>
</html>
