<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manga Galactic — In-App Web Reader</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Mozilla PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/reader.css">
</head>
<body class="reader-body">

  <!-- Top Floating Reader Toolbar -->
  <header class="reader-navbar" id="readerNavbar">
    <div class="reader-nav-left">
      <a href="/web" class="btn-nav-round" id="btnBackToCatalog" title="Back to Catalog">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div class="reader-meta">
        <h2 id="readerMangaTitle" class="manga-nav-title">Loading Manga...</h2>
        <div class="chapter-selector-wrap">
          <select id="chapterSelect" class="chapter-dropdown">
            <option value="1">Chapter 1</option>
          </select>
        </div>
      </div>
    </div>

    <div class="reader-nav-right">
      <button class="btn-nav-round" id="btnWidthToggle" title="Toggle PC Reading Width (Normal / Wide / Compact / Full)">
        <i class="fa-solid fa-arrows-left-right-to-line"></i>
      </button>
      <button class="btn-nav-round active" id="btnModeWebtoon" title="Webtoon Vertical Scroll">
        <i class="fa-solid fa-scroll"></i>
      </button>
      <button class="btn-nav-round" id="btnModePage" title="Page-by-Page Flip">
        <i class="fa-solid fa-book-open"></i>
      </button>
      <button class="btn-nav-round" id="btnFullscreen" title="Fullscreen Mode">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- Reader Main Viewport -->
  <main class="reader-viewport" id="readerViewport">
    <!-- Loading Screen -->
    <div id="readerLoader" class="reader-loader">
      <div class="loader-spinner"></div>
      <p id="loaderStatusText">Fetching chapter stream from Telegram CDN...</p>
      <div class="loader-progress-bar"><div class="progress-fill" id="loadProgress"></div></div>
    </div>

    <!-- Archive / Telegram Fallback Card -->
    <div id="readerErrorState" class="reader-error-card" style="display:none;">
      <div class="channel-stream-icon">
        <i class="fa-brands fa-telegram"></i>
      </div>
      <h3 id="readerErrorTitle">Chapter in Telegram Channel</h3>
      <p id="readerErrorMsg">This chapter's PDF is archived in the official channel. Tap below to jump directly to the post.</p>
      <button id="errorChannelLink" class="btn btn-primary btn-tg-stream" style="margin-top: 16px; width: 100%;">
        <i class="fa-brands fa-telegram"></i> Open in Telegram Channel
      </button>
    </div>

    <!-- Webtoon Mode Continuous Canvas Container -->
    <div id="webtoonContainer" class="webtoon-scroll-view"></div>

    <!-- Page Flip Mode Viewport -->
    <div id="pageFlipContainer" class="page-flip-view" style="display:none;">
      <div class="page-canvas-wrap">
        <canvas id="flipCanvas"></canvas>
      </div>
      <!-- Left & Right Touch Tap Zones -->
      <div class="tap-zone tap-left" id="tapLeft"></div>
      <div class="tap-zone tap-right" id="tapRight"></div>
    </div>

    <!-- 🔥 Chapter Reactions & 💬 Community Discussion Section -->
    <div id="chapterSocialSection" class="chapter-social-container" style="display:none;">
      <!-- Reactions Bar -->
      <div class="chapter-reactions-box">
        <div class="social-box-header">
          <span class="social-header-title"><i class="fa-solid fa-fire-flame-curved"></i> CHAPTER VIBES</span>
          <span class="reactions-total-badge" id="reactTotalCount">0 Reactions</span>
        </div>
        <div class="reactions-btn-grid">
          <button class="reaction-pill-btn" id="reactBtn_fire" onclick="handleReaction('fire')" title="Fire / Epic">
            <span class="reaction-emoji">🔥</span>
            <span class="reaction-label">Fire</span>
            <span class="reaction-counter" id="reactCountFire">0</span>
          </button>
          <button class="reaction-pill-btn" id="reactBtn_shock" onclick="handleReaction('shock')" title="Shocked / Plot Twist">
            <span class="reaction-emoji">😱</span>
            <span class="reaction-label">Shock</span>
            <span class="reaction-counter" id="reactCountShock">0</span>
          </button>
          <button class="reaction-pill-btn" id="reactBtn_heart" onclick="handleReaction('heart')" title="Love / Peak Fiction">
            <span class="reaction-emoji">❤️</span>
            <span class="reaction-label">Love</span>
            <span class="reaction-counter" id="reactCountHeart">0</span>
          </button>
          <button class="reaction-pill-btn" id="reactBtn_crown" onclick="handleReaction('crown')" title="GOAT / Peak">
            <span class="reaction-emoji">👑</span>
            <span class="reaction-label">GOAT</span>
            <span class="reaction-counter" id="reactCountCrown">0</span>
          </button>
        </div>
      </div>

      <!-- Comments Discussion Drawer -->
      <div class="chapter-comments-box">
        <div class="social-box-header">
          <span class="social-header-title"><i class="fa-solid fa-comments"></i> DISCUSSION <span id="commentsHeaderCount">(0)</span></span>
        </div>

        <!-- Comment Input Box -->
        <div class="comment-input-wrap">
          <div class="comment-input-box">
            <input type="text" id="commentTextInput" placeholder="Drop a thought on this chapter..." maxlength="500" autocomplete="off">
            <button id="commentSubmitBtn" class="btn-send-comment" onclick="submitChapterComment()" title="Post Comment">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
        </div>

        <!-- Comments Feed -->
        <div class="comments-feed-list" id="commentsFeedList">
          <div class="comments-empty-state" id="commentsEmptyState">
            <i class="fa-regular fa-comment-dots"></i>
            <p>No comments yet. Be the first to start the discussion!</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Floating Navigation Bar -->
  <footer class="reader-footer" id="readerFooter">
    <button class="btn-footer-nav" id="btnPrevChapter">
      <i class="fa-solid fa-backward-step"></i> Prev
    </button>
    
    <div class="page-counter-badge">
      <span id="pageIndicator">Page 1 / 1</span>
    </div>

    <button class="btn-footer-bookmark" id="btnQuickBookmark">
      <i class="fa-solid fa-bookmark"></i> Bookmark
    </button>

    <button class="btn-footer-nav" id="btnNextChapter">
      Next <i class="fa-solid fa-forward-step"></i>
    </button>
  </footer>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="/static/js/reader.js"></script>
</body>
</html>
